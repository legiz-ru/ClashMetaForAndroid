# RU Bundle Template for ClashMetaForAndroid
# Based on Prizrak-Box Template_1
# Focus: Re:filter + international services (Telegram, Discord, YouTube)

mode: rule
log-level: info
mixed-port: 7890
unified-delay: true
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: always

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443

dns:
  enable: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - tls://77.88.8.8#DIRECT
    - 195.208.4.1#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#PROXY

proxies:
  # Proxies will be injected here from subscription

proxy-groups:
  - name: PROXY
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    proxies:
      - AUTO
      # LEAVE THIS LINE!
    include-all: true

  - name: YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    proxies:
      - PROXY
      # LEAVE THIS LINE!
    include-all: true

  - name: Discord
    icon: https://raw.githubusercontent.com/remnawave/templates/refs/heads/main/icons/Discord.png
    type: select
    proxies:
      - PROXY
      # LEAVE THIS LINE!
    include-all: true

  - name: Telegram
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    type: select
    include-all: true
    proxies:
      - PROXY

  - name: AUTO
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      # LEAVE THIS LINE!
    include-all: true

rule-providers:
  telegram-ips:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/telegram.mrs
    path: ./rule-sets/telegram-ips.mrs

  telegram-domains:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/telegram.mrs
    path: ./rule-sets/telegram-domains.mrs

  discord-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/discord.mrs
    path: ./rule-sets/discord-domains.mrs
    interval: 86400

  refilter-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/domain-rule.mrs
    path: ./rule-sets/refilter-domains.mrs
    interval: 86400

  refilter-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/ip-rule.mrs
    path: ./rule-sets/refilter-ips.mrs
    interval: 86400

  youtube:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/youtube.mrs
    path: ./rule-sets/youtube.mrs
    interval: 86400

  ru-bundle:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/ru-bundle/rule.mrs
    path: ./rule-sets/ru-bundle.mrs
    interval: 86400

rules:
  - OR,((RULE-SET,telegram-ips),(RULE-SET,telegram-domains)),Telegram
  - RULE-SET,youtube,YouTube
  - RULE-SET,discord-domains,Discord
  - RULE-SET,ru-bundle,PROXY
  - RULE-SET,refilter-domains,PROXY
  - RULE-SET,refilter-ips,PROXY
  - MATCH,DIRECT
