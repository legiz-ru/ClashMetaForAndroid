<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d12">
  <title>Prizrak-Box — Импорт на TV</title>

  <!-- Local dependencies (no CDN required) -->
  <script src="js/jsQR.min.js"></script>
  <script type="module">
    import QrScanner from './js/qr-scanner.min.js';
    window._QrScanner = QrScanner;
  </script>

  <style>
    /* Local fonts — Syne + DM Sans */
    @font-face {
      font-family: 'Syne';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/syne-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Syne';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('fonts/syne-latin-600-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Syne';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/syne-latin-700-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Syne';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('fonts/syne-latin-800-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('fonts/dm-sans-latin-300-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/dm-sans-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('fonts/dm-sans-latin-500-normal.woff2') format('woff2');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --surface2: #1e1e2a;
      --border: #2a2a3a;
      --accent: #7c5cfc;
      --accent2: #c084fc;
      --text: #e8e6f0;
      --muted: #6b6880;
      --success-bg: #0d2218;
      --success: #34d399;
      --error-bg: #200d10;
      --error: #f87171;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,92,252,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,92,252,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,92,252,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px 32px;
      max-width: 500px;
      width: 100%;
      position: relative;
      box-shadow: 0 0 0 1px rgba(124,92,252,.08), 0 32px 64px rgba(0,0,0,.5);
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 120px; height: 120px;
      background: radial-gradient(circle at top left, rgba(124,92,252,.15), transparent 70%);
      border-radius: 24px 0 0 0;
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo-wrap {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .header-text h1 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.3px;
      line-height: 1.1;
    }

    .header-text p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* URL prefill banner */
    .prefill-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(124,92,252,.1);
      border: 1px solid rgba(124,92,252,.25);
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 12.5px;
      color: var(--accent2);
      transition: opacity .5s ease;
    }
    .prefill-badge.visible { display: flex; }
    .prefill-badge .pb-icon { font-size: 15px; }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13.5px;
      font-family: 'DM Mono', 'Fira Code', 'Courier New', monospace;
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,252,.15);
    }

    textarea::placeholder { color: var(--muted); font-family: 'DM Sans', sans-serif; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    #submit {
      flex: 1;
      height: 50px;
      background: linear-gradient(135deg, var(--accent), #9b6dff);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(124,92,252,.35);
      letter-spacing: .2px;
      transition: all .2s;
      white-space: nowrap;
    }

    #submit:hover {
      background: linear-gradient(135deg, #8b6cff, #a97dff);
      box-shadow: 0 6px 28px rgba(124,92,252,.5);
      transform: translateY(-1px);
    }
    #submit:active { transform: translateY(0); }
    #submit:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .spinner {
      display: none;
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      margin-top: 16px;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(52,211,153,.2);
    }

    #status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(248,113,113,.2);
    }

    .hint-block {
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .hint-block strong { color: var(--accent2); font-weight: 500; }
  </style>
</head>

      </div>
      <div class="header-text">
        <h1>Prizrak-Box</h1>
        <p>Импорт профиля на TV</p>
      </div>
    </div>

    <div class="prefill-badge" id="prefill-badge">
      <span class="pb-icon">🔗</span>
      <span>Ссылка подставлена из параметра запроса</span>

  <script>
    // Pre-fill from ?url= query parameter
    (function prefillFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      if (!url) return;

      document.getElementById('content').value = url;
      document.getElementById('content').placeholder = '';

      const badge = document.getElementById('prefill-badge');
      badge.classList.add('visible');
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => badge.classList.remove('visible'), 500);
      }, 2500);
    })();

    // ── AES-256-GCM (pure JS) ──────────────────────────────────────────────
    // WebCrypto (crypto.subtle) is unavailable over plain http on a LAN IP
    // (non-secure context), so the encrypted /api/transfer path is implemented
    // here. crypto.getRandomValues IS available and is used for the nonce.
    const PXA = (function () {
      const S = new Uint8Array([
        0x63,0x7c,0x77,0x7b,0xf2,0x6b,0x6f,0xc5,0x30,0x01,0x67,0x2b,0xfe,0xd7,0xab,0x76,

        0x04,0xc7,0x23,0xc3,0x18,0x96,0x05,0x9a,0x07,0x12,0x80,0xe2,0xeb,0x27,0xb2,0x75,
        0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
        0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
        0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
        0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
        0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,
        0x60,0x81,0x4f,0xdc,0x22,0x2a,0x90,0x88,0x46,0xee,0xb8,0x14,0xde,0x5e,0x0b,0xdb,
        0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,
        0xe7,0xc8,0x37,0x6d,0x8d,0xd5,0x4e,0xa9,0x6c,0x56,0xf4,0xea,0x65,0x7a,0xae,0x08,
        0xba,0x78,0x25,0x2e,0x1c,0xa6,0xb4,0xc6,0xe8,0xdd,0x74,0x1f,0x4b,0xbd,0x8b,0x8a,
        0x70,0x3e,0xb5,0x66,0x48,0x03,0xf6,0x0e,0x61,0x35,0x57,0xb9,0x86,0xc1,0x1d,0x9e,
        0xe1,0xf8,0x98,0x11,0x69,0xd9,0x8e,0x94,0x9b,0x1e,0x87,0xe9,0xce,0x55,0x28,0xdf,
        0x8c,0xa1,0x89,0x0d,0xbf,0xe6,0x42,0x68,0x41,0x99,0x2d,0x0f,0xb0,0x54,0xbb,0x16
      ]);
      function xtime(a){ a<<=1; if(a&0x100) a^=0x11b; return a&0xff; }
      function expandKey(key){
        const Nk=8, Nr=14, W=new Uint8Array(16*(Nr+1));
        W.set(key,0);
        const rcon=[0x01,0x02,0x04,0x08,0x10,0x20,0x40];
        for(let i=Nk;i<4*(Nr+1);i++){
          let t=[W[(i-1)*4],W[(i-1)*4+1],W[(i-1)*4+2],W[(i-1)*4+3]];
          if(i%Nk===0){ t=[S[t[1]]^rcon[i/Nk-1],S[t[2]],S[t[3]],S[t[0]]]; }
          else if(i%Nk===4){ t=[S[t[0]],S[t[1]],S[t[2]],S[t[3]]]; }
          for(let j=0;j<4;j++) W[i*4+j]=W[(i-Nk)*4+j]^t[j];
        }
        return W;
      }
      function shiftRows(s){ const o=new Uint8Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++) o[c*4+r]=s[((c+r)%4)*4+r]; return o; }
      function mixColumns(s){
        const o=new Uint8Array(16);
        for(let c=0;c<4;c++){ const i=c*4, a0=s[i],a1=s[i+1],a2=s[i+2],a3=s[i+3];
          o[i]   = xtime(a0)^(xtime(a1)^a1)^a2^a3;
          o[i+1] = a0^xtime(a1)^(xtime(a2)^a2)^a3;
          o[i+2] = a0^a1^xtime(a2)^(xtime(a3)^a3);
          o[i+3] = (xtime(a0)^a0)^a1^a2^xtime(a3);
        }
        return o;
      }
      function encBlock(W,inp){
        const Nr=14; let s=new Uint8Array(inp);
        for(let i=0;i<16;i++) s[i]^=W[i];
        for(let round=1;round<Nr;round++){
          for(let i=0;i<16;i++) s[i]=S[s[i]];
          s=shiftRows(s); s=mixColumns(s);
          for(let i=0;i<16;i++) s[i]^=W[round*16+i];
        }
        for(let i=0;i<16;i++) s[i]=S[s[i]];
        s=shiftRows(s);
        for(let i=0;i<16;i++) s[i]^=W[Nr*16+i];
        return s;
      }
      function inc32(c){ for(let i=15;i>=12;i--){ c[i]=(c[i]+1)&0xff; if(c[i]!==0) break; } }
      function gfmul(X,Y){
        const Z=new Uint8Array(16), V=new Uint8Array(Y);
        for(let i=0;i<128;i++){
          if((X[i>>3]>>(7-(i&7)))&1) for(let j=0;j<16;j++) Z[j]^=V[j];
          const lsb=V[15]&1;
          for(let j=15;j>0;j--) V[j]=((V[j]>>1)|((V[j-1]&1)<<7))&0xff;
          V[0]=V[0]>>1; if(lsb) V[0]^=0xe1;
        }
        return Z;
      }
      function ghash(H,data){
        let Y=new Uint8Array(16);
        for(let i=0;i<data.length;i+=16){ for(let j=0;j<16;j++) Y[j]^=data[i+j]; Y=gfmul(Y,H); }
        return Y;
      }
      function gcmEncrypt(key,iv,pt){
        const W=expandKey(key), H=encBlock(W,new Uint8Array(16));
        const J0=new Uint8Array(16); J0.set(iv,0); J0[15]=1;
        const ct=new Uint8Array(pt.length), ctr=new Uint8Array(J0);
        for(let i=0;i<pt.length;i+=16){ inc32(ctr); const ks=encBlock(W,ctr);
          for(let j=0;j<16 && i+j<pt.length;j++) ct[i+j]=pt[i+j]^ks[j]; }
        const padLen=(16-(ct.length%16))%16, off=ct.length+padLen, bits=ct.length*8;
        const gin=new Uint8Array(off+16); gin.set(ct,0);
        gin[off+12]=(bits>>>24)&0xff; gin[off+13]=(bits>>>16)&0xff; gin[off+14]=(bits>>>8)&0xff; gin[off+15]=bits&0xff;
        const Sg=ghash(H,gin), ej0=encBlock(W,J0), out=new Uint8Array(ct.length+16);
        out.set(ct,0); for(let j=0;j<16;j++) out[ct.length+j]=Sg[j]^ej0[j];
        return out;
      }
      function b64uDec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
      function b64uEnc(u){ let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
      function encryptPayload(keyB64, plaintext){
        const iv=new Uint8Array(12); crypto.getRandomValues(iv);
        const ct=gcmEncrypt(b64uDec(keyB64), iv, new TextEncoder().encode(plaintext));
        return { nonce: b64uEnc(iv), data: b64uEnc(ct) };
      }
      return { encryptPayload };
    })();

    async function send() {
      const content = document.getElementById('content').value.trim();
      if (!content) {
        showStatus('error', '❌ Поле не может быть пустым');
        return;
      }

      const btn = document.getElementById('submit');
      const text = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      text.textContent = 'Отправка...';
      document.getElementById('status').className = '';
      document.getElementById('status').style.display = 'none';

      try {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('t');
        const key = params.get('k');
        let res;
        if (token && key) {
          // Secured channel: encrypt the payload (AES-256-GCM) and authenticate
          // with the one-time token. tv import server requires both on /api/transfer.
          const enc = PXA.encryptPayload(key, JSON.stringify({ type: 'text', content }));
          res = await fetch('/Prizrak-BoxTVimport/api/transfer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-PXA-Token': token },
            body: JSON.stringify({ nonce: enc.nonce, data: enc.data })
          });
        } else {
          res = await fetch('/Prizrak-BoxTVimport/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content })
          });
        }
        const data = await res.json();
        if (data.status === 'ok') {
          showStatus('success', '✅ Профиль успешно передан на TV!');
          document.getElementById('content').value = '';
        } else {
          showStatus('error', '❌ Ошибка: ' + (data.message || 'Неизвестная ошибка'));
        }
      } catch (e) {
        showStatus('error', '❌ Не удалось подключиться к TV. Проверьте Wi-Fi.');
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        text.textContent = 'Отправить на TV';
      }
    }

    function showStatus(type, msg) {
      const el = document.getElementById('status');
      el.className = type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.getElementById('content').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
    });

    // Auto-submit: when the link carries ?autosubmit=true and the field is prefilled
    // (e.g. ?url=…&autosubmit=true&t=…&k=…), send immediately. send() picks the secured
    // /api/transfer (when t/k are present) or plain /submit, and shows the result text.
    (function autoSubmit() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('autosubmit') === 'true' &&
          document.getElementById('content').value.trim()) {
        send();
      }
    })();
  </script>
