name: Update Moshen Core and Go Modules
on:
  workflow_dispatch:
    inputs:
      moshen_version:
        description: 'snakem982/mihomo version tag to pin (e.g. v1.1.17-moshen). Leave empty to only refresh go.sum.'
        required: false
        default: ''

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true # Always check for the latest patch release

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Pin new moshen version in go.mod files
        if: ${{ inputs.moshen_version != '' }}
        run: |
          NEW_VERSION="${{ inputs.moshen_version }}"
          sed -i "s|replace github.com/metacubex/mihomo => github.com/snakem982/mihomo .*|replace github.com/metacubex/mihomo => github.com/snakem982/mihomo $NEW_VERSION|g" \
            core/src/foss/golang/go.mod \
            core/src/main/golang/go.mod
          echo "Pinned mihomo to $NEW_VERSION"
          grep "replace github.com/metacubex/mihomo" core/src/foss/golang/go.mod
          grep "replace github.com/metacubex/mihomo" core/src/main/golang/go.mod

      - name: Update Foss Gomod
        run: |
          cd ${{ github.workspace }}/core/src/foss/golang/
          GONOSUMDB=github.com/snakem982/mihomo go mod tidy

      - name: Update Main Gomod
        run: |
          cd ${{ github.workspace }}/core/src/main/golang/
          GONOSUMDB=github.com/snakem982/mihomo go mod tidy

      - uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.MAINTAINER_APPID }}
          private_key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Update Dependencies
          branch: update-dependencies
          delete-branch: true
          title: 'Update Dependencies'
          draft: false
          body: |
            - Update Moshen Core (snakem982/mihomo)
            - Update Go Module Dependencies
          labels: |
            Update

      - name: PR result
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
