name: Update Moshen Core and Go Modules
on:
  workflow_dispatch:
    inputs:
      moshen_version:
        description: 'legiz-ru/moshen version tag (e.g. v1.1.17-moshen-splithttp). Leave empty to auto-detect latest release.'
        required: false
        default: ''

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve moshen version
        id: resolve
        run: |
          INPUT="${{ inputs.moshen_version }}"
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -sf "https://api.github.com/repos/legiz-ru/moshen/releases/latest" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r '.tag_name')
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin new moshen version in go.mod files
        run: |
          NEW_VERSION="${{ steps.resolve.outputs.version }}"
          sed -i "s|replace github.com/metacubex/mihomo => github.com/legiz-ru/moshen .*|replace github.com/metacubex/mihomo => github.com/legiz-ru/moshen $NEW_VERSION|g" \
            core/src/foss/golang/go.mod \
            core/src/main/golang/go.mod
          echo "Pinned moshen to $NEW_VERSION"
          grep "replace github.com/metacubex/mihomo" core/src/foss/golang/go.mod
          grep "replace github.com/metacubex/mihomo" core/src/main/golang/go.mod

      - name: Update Foss Gomod
        run: |
          cd ${{ github.workspace }}/core/src/foss/golang/
          GONOSUMDB=github.com/legiz-ru/moshen go mod tidy

      - name: Update Main Gomod
        run: |
          cd ${{ github.workspace }}/core/src/main/golang/
          GONOSUMDB=github.com/legiz-ru/moshen go mod tidy

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update moshen to ${{ steps.resolve.outputs.version }}"
          branch: update-dependencies
          delete-branch: true
          title: "Update moshen to ${{ steps.resolve.outputs.version }}"
          draft: false
          body: |
            - Update Moshen Core (legiz-ru/moshen) → `${{ steps.resolve.outputs.version }}`
            - Update Go Module Dependencies
          labels: |
            Update

      - name: PR result
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
